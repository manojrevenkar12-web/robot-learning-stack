# Policy-class study: same backbone, recipe and data, chunk length 1 (plain behaviour cloning).
run_name: bc_single_step
dataset: data/release/rls_panda
policy: chunk_transformer
policy_config: {chunk: 1, action_space: ee, augment_shift: 2, aux_object_weight: 1.0, state_noise: 0.1, state_dropout: 0.3, film: true}
steps: 1500
batch_size: 32
eval_every: 250
threads: 1
