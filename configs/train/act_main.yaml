# Main policy: language-conditioned action-chunking transformer (ACT-style, FiLM-conditioned CNN) on all curated data
# (ROS 2 teleop recordings + domain-randomized synthetic). Tool-pose actions, auxiliary object
# localisation and proprioception noise/dropout: see docs/training.md for why each is there.
run_name: act_main
dataset: data/release/rls_panda
policy: chunk_transformer
policy_config: {chunk: 20, action_space: ee, augment_shift: 2, aux_object_weight: 1.0, state_noise: 0.1, state_dropout: 0.3, film: true}
steps: 6000
batch_size: 32
lr: 3.0e-4
warmup: 150
eval_every: 250
seed: 0
threads: 1
notes: main policy, all sources
