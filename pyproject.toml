[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-learning-stack"
version = "0.1.0"
description = "ROS 2 data capture, dataset curation, policy training/evaluation and deployment for robot manipulation (MuJoCo Panda)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.2",
  "h5py>=3.10",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "pillow>=10",
  "av>=12",
  "mcap>=1.1",
  "mcap-ros2-support>=0.5",
  "torch>=2.4",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3"]
tracking = ["mlflow-skinny>=2.12"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "imageio>=2.34", "gymnasium>=1.0", "stable-baselines3>=2.3", "mlflow-skinny>=2.12"]

[project.scripts]
rls = "rls.cli:main"

[tool.setuptools.packages.find]
include = ["rls*"]

[tool.setuptools.package-data]
rls = ["sim/assets/franka_panda/*.xml", "sim/assets/franka_panda/LICENSE", "sim/assets/franka_panda/README.md", "sim/assets/franka_panda/assets/*", "tools/static/*"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["rls/sim/assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "B008", "RUF046", "SIM115", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
"rls/sim/scene.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["rls"]

[[tool.mypy.overrides]]
# rclpy's declare_parameters / message stubs are looser than its runtime API
module = ["rls.ros.*"]
disable_error_code = ["list-item", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:launch_testing -p no:launch_testing_ros_pytest_entrypoint -p no:launch_ros"
